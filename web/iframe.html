<!DOCTYPE html>
<html lang="ja">
<head>

<title>iframe embed check - ぷゆもんコロシアム 155 Battle</title>
<style>
  html, body {
    margin: 0;
    padding: 0;

    background: #0f141f;
    color: #c8d2e0;
    font: 14px/1.6 ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  main {
    max-width: 720px;
    margin: 0 auto;
    padding: 24px 16px 48px;
  }
  h1 {
    font-size: 16px;
    font-weight: 600;
    margin: 0 0 8px;
  }
  p {
    margin: 0 0 24px;

  .frame {
    width: 100%;
    aspect-ratio: 16 / 9;
    border: 1px solid #2c3a52;

    display: block;

    height: 100%;

<main>
  <h1>iframe embed check</h1>
  <p>配信時と同じく iframe へ埋め込んだ状態でゲームループが継続するかを確認するページ。
     枠内の ticks が増え続けていれば Update / Draw が動いている。</p>
  <div class="frame">
    <iframe src="index.html" title="ぷゆもんコロシアム 155 Battle (PoC)"></iframe>
  </div>
